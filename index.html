<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Lágrimas de Fênix</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body { margin:0; font-family:Arial; background:#0f0f0f; color:#fff; }
header {
  background:#1a1a1a;
  padding:14px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
header h1 { margin:0; color:#ff7a00; font-size:20px; }

.login input {
  background:#2b2b2b; color:#fff;
  border:none; border-radius:6px;
  padding:6px; width:110px;
}
.login button {
  background:#ff7a00; color:#000;
  border:none; border-radius:6px;
  padding:6px 10px; cursor:pointer;
  font-weight:bold;
}

.container { max-width:900px; margin:auto; padding:20px; }
.card { background:#1e1e1e; border-radius:10px; padding:20px; margin-bottom:20px; }
input, button { width:100%; padding:12px; margin-top:10px; border:none; border-radius:6px; }
input { background:#2b2b2b; color:#fff; }
button { background:#ff7a00; color:#000; font-weight:bold; cursor:pointer; }

.hidden { display:none; }

table { width:100%; border-collapse:collapse; margin-top:10px; }
th, td { border:1px solid #333; padding:8px; }
th { background:#2a2a2a; }
</style>
</head>

<body>

<header>
  <h1>Lágrimas de Fênix</h1>
  <div class="login">
    <input id="adminUser" placeholder="Usuário">
    <input id="adminPass" type="password" placeholder="Senha">
    <button onclick="login()">Entrar</button>
    <span id="status"></span>
  </div>
</header>

<div class="container">

  <div class="card">
    <h2>📦 Fazer Encomenda</h2>
    <input id="discord" placeholder="@ do Discord">
    <input id="nick" placeholder="Nick no jogo">
    <input id="qtd" type="number" value="1" min="1">
    <button onclick="enviar()">Enviar Encomenda</button>
    <p id="msg"></p>
  </div>

  <div class="card hidden" id="admin">
    <h2>👑 Gerenciador</h2>
    <table>
      <thead>
        <tr><th>Discord</th><th>Nick</th><th>Qtd</th><th>Ação</th></tr>
      </thead>
      <tbody id="lista"></tbody>
    </table>
    <button onclick="limpar()">Limpar Tudo</button>
  </div>

</div>

<script>
/* CONFIG */
const ADMIN_USER = "Runeterra Shadow";
const ADMIN_PASS = "4465-22-1Rgm";
const STORAGE = "fenix_pedidos";

/* CARREGA SEMPRE */
let pedidos = JSON.parse(localStorage.getItem(STORAGE) || "[]");

/* ENVIO */
function enviar() {
  const d = discord.value.trim();
  const n = nick.value.trim();
  const q = parseInt(qtd.value);

  if (!d || !n || q < 1) {
    msg.innerText = "Preencha tudo corretamente";
    return;
  }

  pedidos.push({ d, n, q });
  localStorage.setItem(STORAGE, JSON.stringify(pedidos));

  msg.innerText = "✅ Encomenda salva!";
  discord.value = nick.value = "";
  qtd.value = 1;
}

/* LOGIN */
function login() {
  if (adminUser.value === ADMIN_USER && adminPass.value === ADMIN_PASS) {
    admin.classList.remove("hidden");
    status.innerText = "👑";
    render();
  } else {
    status.innerText = "❌";
  }
}

/* RENDER */
function render() {
  lista.innerHTML = "";
  pedidos.forEach((p,i)=>{
    lista.innerHTML += `
      <tr>
        <td>${p.d}</td>
        <td>${p.n}</td>
        <td>${p.q}</td>
        <td><button onclick="entregue(${i})">Entregue</button></td>
      </tr>`;
  });
}

/* REMOVER */
function entregue(i){
  pedidos.splice(i,1);
  localStorage.setItem(STORAGE, JSON.stringify(pedidos));
  render();
}

function limpar(){
  if(confirm("Limpar tudo?")){
    pedidos = [];
    localStorage.setItem(STORAGE,"[]");
    render();
  }
}
</script>

</body>
</html>
