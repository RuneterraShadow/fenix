<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Encomendas - Lágrimas de Fênix</title>
  <style>
    body { font-family: Arial, sans-serif; margin:0; background:#0f0f0f; color:#fff; }
    header { background:#1a1a1a; padding:15px 20px; display:flex; justify-content:space-between; align-items:center; }
    header h1 { margin:0; color:#ff7a00; }
    .container { max-width:900px; margin:auto; padding:20px; }
    .card { background:#1e1e1e; border-radius:10px; padding:20px; margin-bottom:20px; }
    img { max-width:100%; border-radius:10px; }
    .price { color:#00ff88; font-size:24px; font-weight:bold; }
    input, button { width:100%; padding:12px; margin-top:10px; border:none; border-radius:6px; }
    button { background:#5865F2; color:#fff; font-weight:bold; cursor:pointer; }
    button:hover { opacity:0.9; }
    table { width:100%; border-collapse:collapse; margin-top:10px; }
    th, td { border:1px solid #333; padding:8px; }
    th { background:#2a2a2a; }
    .hidden { display:none; }
    .top-right button { width:auto; padding:8px 14px; }
  </style>
</head>
<body>

<header>
  <h1>Lágrimas de Fênix</h1>
  <div class="top-right">
    <button onclick="loginDiscord()">Entrar com Discord</button>
    <span id="loginStatus"></span>
  </div>
</header>

<div class="container">

  <div class="card">
    <img src="Venda fenix!.png" alt="Lágrimas de Fênix" onerror="this.style.display='none'">
    <h2>Soro de Recuperação Rápida PT-29</h2>
    <p class="price">R$ 10.000</p>
    <p>Substância experimental secreta de uso militar conhecida como <b>Lágrimas de Fênix</b>.</p>
  </div>

  <div class="card">
    <h2>📦 Fazer Encomenda</h2>
    <input id="discord" placeholder="@ do Discord">
    <input id="nick" placeholder="Nick no jogo">
    <input id="qtd" type="number" min="1" value="1">
    <button onclick="enviarEncomenda()">Enviar Encomenda</button>
    <p id="msg"></p>
  </div>

  <div class="card hidden" id="adminPanel">
    <h2>👑 Gerenciador de Encomendas (Admin)</h2>
    <table>
      <thead>
        <tr><th>Discord</th><th>Nick</th><th>Qtd</th><th>Ação</th></tr>
      </thead>
      <tbody id="adminLista"></tbody>
    </table>
  </div>

</div>

<script>
// 🔐 CONFIGURAÇÃO
const DISCORD_CLIENT_ID = "COLE_SEU_CLIENT_ID_AQUI";
const ADMIN_DISCORD_ID = "1464077708723097702"; // ex: 123456789012345678
const REDIRECT_URI = window.location.origin + window.location.pathname;
const WEBHOOK = "https://discord.com/api/webhooks/1464068318955569447/X7ijBubyKS39gXUO-WgkIe_NAw2LzhZ0ifqbUvrjH7GisdE7X8FxazSWo0BQLIB9GZ1w";

let encomendas = [];
let adminLogado = false;

// LOGIN VIA DISCORD
function loginDiscord() {
  const url = `https://discord.com/oauth2/authorize?client_id=${DISCORD_CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=identify`;
  window.location.href = url;
}

// PROCESSA LOGIN
if (window.location.hash.includes('access_token')) {
  const params = new URLSearchParams(window.location.hash.substring(1));
  const token = params.get('access_token');

  fetch('https://discord.com/api/users/@me', {
    headers: { Authorization: `Bearer ${token}` }
  })
  .then(res => res.json())
  .then(user => {
    if (user.id === ADMIN_DISCORD_ID) {
      adminLogado = true;
      document.getElementById('loginStatus').innerText = '👑 Admin'; document.querySelector('.top-right button').style.display = 'none';
      document.getElementById('adminPanel').classList.remove('hidden');
    } else {
      document.getElementById('loginStatus').innerText = '❌ Sem permissão';
    }
  });
}

// ENCOMENDA
function enviarEncomenda() {
  const discord = document.getElementById('discord').value.trim();
  const nick = document.getElementById('nick').value.trim();
  const qtd = document.getElementById('qtd').value;
  const msg = document.getElementById('msg');

  if (!discord || !nick || qtd < 1) {
    msg.innerText = 'Preencha todos os campos';
    return;
  }

  const pedido = { discord, nick, qtd };
  encomendas.push(pedido);
  if (adminLogado) atualizarAdmin();

  fetch(WEBHOOK, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      content: `🧪 **NOVA ENCOMENDA**
👤 ${discord}
🎮 ${nick}
📦 ${qtd}`
    })
  });

  msg.innerText = '✅ Encomenda enviada!';
  document.getElementById('discord').value = '';
  document.getElementById('nick').value = '';
  document.getElementById('qtd').value = 1;
}

function atualizarAdmin() {
  const lista = document.getElementById('adminLista');
  lista.innerHTML = '';
  encomendas.forEach((e, i) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${e.discord}</td><td>${e.nick}</td><td>${e.qtd}</td><td><button onclick="remover(${i})">Entregue</button></td>`;
    lista.appendChild(tr);
  });
}

function remover(i) {
  encomendas.splice(i, 1);
  atualizarAdmin();
}
</script>

</body>
</html>
