<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lágrimas de Fênix — Encomendas</title>
  <style>
    * { box-sizing: border-box; }
    body { margin:0; font-family: Arial, Helvetica, sans-serif; background:#0f0f0f; color:#fff; }
    header { background:#1a1a1a; padding:14px 20px; display:flex; align-items:center; justify-content:space-between; }
    header h1 { margin:0; color:#ff7a00; font-size:20px; }
    .top-right { display:flex; align-items:center; gap:10px; }
    .btn-discord { background:#5865F2; color:#fff; border:none; border-radius:6px; padding:8px 12px; cursor:pointer; font-weight:bold; }
    .btn-discord:hover { opacity:.9; }
    .badge { font-size:14px; }
    .container { max-width:900px; margin:auto; padding:20px; }
    .card { background:#1e1e1e; border-radius:10px; padding:20px; margin-bottom:20px; }
    img { max-width:100%; border-radius:10px; }
    .price { color:#00ff88; font-size:24px; font-weight:bold; }
    input, button { width:100%; padding:12px; margin-top:10px; border:none; border-radius:6px; }
    input { background:#2b2b2b; color:#fff; }
    button.primary { background:#ff7a00; color:#000; font-weight:bold; cursor:pointer; }
    button.primary:hover { background:#ff9a33; }
    .hidden { display:none; }
    table { width:100%; border-collapse:collapse; margin-top:10px; }
    th, td { border:1px solid #333; padding:8px; text-align:left; }
    th { background:#2a2a2a; }
    .btn-small { padding:6px 10px; font-size:12px; width:auto; }
  </style>
</head>
<body>

<header>
  <h1>Lágrimas de Fênix</h1>
  <div class="top-right">
    <button id="btnLogin" class="btn-discord" onclick="loginDiscord()">Entrar com Discord</button>
    <span id="loginStatus" class="badge"></span>
  </div>
</header>

<div class="container">

  <div class="card">
    <img src="Venda fenix!.png" alt="Lágrimas de Fênix" onerror="this.style.display='none'">
    <h2>Soro de Recuperação Rápida PT-29</h2>
    <p class="price">R$ 10.000</p>
    <p>Substância experimental secreta de uso militar conhecida como <b>Lágrimas de Fênix</b>.</p>
  </div>

  <div class="card">
    <h2>📦 Fazer Encomenda</h2>
    <input id="discord" placeholder="@ do Discord">
    <input id="nick" placeholder="Nick no jogo">
    <input id="qtd" type="number" min="1" value="1">
    <button class="primary" onclick="enviarEncomenda()">Enviar Encomenda</button>
    <p id="msg"></p>
  </div>

  <div class="card hidden" id="adminPanel">
    <h2>👑 Gerenciador de Encomendas (Admin)</h2>
    <table>
      <thead>
        <tr>
          <th>Discord</th>
          <th>Nick</th>
          <th>Qtd</th>
          <th>Ação</th>
        </tr>
      </thead>
      <tbody id="adminLista"></tbody>
    </table>
  </div>

</div>

<script>
// ================= CONFIGURAÇÃO =================
const DISCORD_CLIENT_ID = "COLE_SEU_CLIENT_ID_AQUI"; // obrigatório
const ADMIN_DISCORD_ID = "1464077708723097702"; // SEU ID (admin único)
const WEBHOOK = "https://discord.com/api/webhooks/1464068318955569447/X7ijBubyKS39gXUO-WgkIe_NAw2LzhZ0ifqbUvrjH7GisdE7X8FxazSWo0BQLIB9GZ1w";
const REDIRECT_URI = window.location.origin + window.location.pathname;

// ================= ESTADO =================
let adminLogado = false;
let encomendas = [];

// ================= LOGIN DISCORD =================
function loginDiscord() {
  const authURL = `https://discord.com/oauth2/authorize?client_id=${DISCORD_CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=identify`;
  window.location.href = authURL;
}

// Processa retorno OAuth
if (window.location.hash.includes('access_token')) {
  const params = new URLSearchParams(window.location.hash.substring(1));
  const token = params.get('access_token');

  fetch('https://discord.com/api/users/@me', {
    headers: { Authorization: `Bearer ${token}` }
  })
  .then(r => r.json())
  .then(user => {
    if (user && user.id === ADMIN_DISCORD_ID) {
      adminLogado = true;
      document.getElementById('loginStatus').innerText = '👑 Admin';
      document.getElementById('adminPanel').classList.remove('hidden');
      document.getElementById('btnLogin').style.display = 'none';
    } else {
      document.getElementById('loginStatus').innerText = '❌ Sem permissão';
    }
    // limpa o hash da URL
    history.replaceState(null, '', window.location.pathname);
  })
  .catch(() => {
    document.getElementById('loginStatus').innerText = 'Erro no login';
  });
}

// ================= ENCOMENDA =================
function enviarEncomenda() {
  const discord = document.getElementById('discord').value.trim();
  const nick = document.getElementById('nick').value.trim();
  const qtd = parseInt(document.getElementById('qtd').value, 10);
  const msg = document.getElementById('msg');

  if (!discord || !nick || !qtd || qtd < 1) {
    msg.innerText = 'Preencha todos os campos corretamente.';
    return;
  }

  const pedido = { discord, nick, qtd };
  if (adminLogado) {
    encomendas.push(pedido);
    atualizarAdmin();
  }

  fetch(WEBHOOK, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      content: `🧪 **NOVA ENCOMENDA — LÁGRIMAS DE FÊNIX**\n👤 Discord: ${discord}\n🎮 Nick: ${nick}\n📦 Quantidade: ${qtd}`
    })
  }).catch(() => {});

  msg.innerText = '✅ Encomenda enviada!';
  document.getElementById('discord').value = '';
  document.getElementById('nick').value = '';
  document.getElementById('qtd').value = 1;
}

// ================= ADMIN =================
function atualizarAdmin() {
  const lista = document.getElementById('adminLista');
  lista.innerHTML = '';
  encomendas.forEach((e, i) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${e.discord}</td><td>${e.nick}</td><td>${e.qtd}</td><td><button class="btn-small" onclick="marcarEntregue(${i})">Entregue</button></td>`;
    lista.appendChild(tr);
  });
}

function marcarEntregue(i) {
  encomendas.splice(i, 1);
  atualizarAdmin();
}
</script>

</body>
</html>
